name: Deploy nodeJS code on Excloud

on:
  push:
    branches: 
          - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Deploy on Excloud Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: [2401:5420:0:70d:b4cd:f6ff:fe16:40f3]
        username: ubuntu
        key: ${{ secrets.PRIVATE_KEY }}
        script: |
          cd /home/ubuntu/DevOps-CICD
          git pull
          npm install
          npm run dev
